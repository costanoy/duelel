# Blueprint do Render (render.com/docs/blueprint-spec).
# Ao criar o serviço via "New > Blueprint" apontando pro repo, o Render lê
# este arquivo e já configura build e start sozinho.
#
# Plano atual: "free" — sem disco persistente, mas isso não é mais um problema
# pro ranking: ele mora no Postgres do Supabase (fora do Render), então
# sobrevive a qualquer deploy/restart independente do plano. O único efeito
# do plano free hoje é o serviço "dormir" após inatividade (primeiro acesso
# depois disso demora uns 30-50s pra acordar) — troque "plan: free" por
# "plan: starter" (pago, ~US$7/mês) se quiser eliminar esse cold-start.
#
# DATABASE_URL precisa ser preenchida manualmente no dashboard do Render
# (Settings > Environment) com a connection string do Supabase — não fica
# neste arquivo por ser um segredo.
services:
  - type: web
    name: duelel
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
