# Blueprint do Render (render.com/docs/blueprint-spec).
# Ao criar o serviço via "New > Blueprint" apontando pro repo, o Render lê
# este arquivo e já configura build e start sozinho.
#
# Plano atual: "free" — sem disco persistente (o Render bloqueia `disk:` em
# planos free). Isso significa que o SQLite (ranking) reseta a cada
# deploy/restart, e o serviço "dorme" após inatividade (primeiro acesso
# depois disso demora uns 30-50s pra acordar).
#
# Pra manter o ranking entre deploys mais pra frente: troque "plan: free"
# por "plan: starter" (pago, ~US$7/mês) e adicione de volta:
#
#   envVars:
#     - key: DB_PATH
#       value: /var/data/duelel.db
#   disk:
#     name: duelel-data
#     mountPath: /var/data
#     sizeGB: 1
services:
  - type: web
    name: duelel
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
