<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:inline-flex;align-items:center;gap:0.55em;font-size:{{ size }}px;line-height:1">
  <div style="display:flex;flex-direction:column;gap:0.2em;align-items:flex-end">
    <div style="display:flex;align-items:center;gap:0.12em">
      <span style="width:0.1em;height:0.1em;border-radius:50%;background:#F2C14E;opacity:0.35"></span>
      <span style="width:0.14em;height:0.14em;border-radius:50%;background:#F2C14E;opacity:0.6"></span>
      <span style="width:0.3em;height:0.16em;border-radius:0.1em;background:#F2C14E;opacity:0.8"></span>
      <span style="width:0.95em;height:0.34em;border-radius:0.17em;background:#F2C14E"></span>
    </div>
    <div style="display:flex;align-items:center;gap:0.12em">
      <span style="width:0.1em;height:0.1em;border-radius:50%;background:#49C5E6;opacity:0.35"></span>
      <span style="width:0.14em;height:0.14em;border-radius:50%;background:#49C5E6;opacity:0.6"></span>
      <span style="width:0.3em;height:0.16em;border-radius:0.1em;background:#49C5E6;opacity:0.8"></span>
      <span style="width:1.5em;height:0.34em;border-radius:0.17em;background:#49C5E6"></span>
    </div>
  </div>
  <sc-if value="{{ showWordmark }}" hint-placeholder-val="{{ true }}">
    <span style="font-family:'JetBrains Mono',monospace;font-weight:700;font-size:1em;letter-spacing:-0.02em"><span style="color:#F2C14E">Duel</span><span style="color:#49C5E6">el</span></span>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:80},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:20,&quot;tsType&quot;:&quot;number&quot;},&quot;showWordmark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { size: this.props.size ?? 20, showWordmark: this.props.showWordmark ?? true };
  }
}
</script>
</body>
</html>
